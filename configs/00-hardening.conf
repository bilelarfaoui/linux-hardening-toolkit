# Baseline SSH hardening, installed as a drop-in.
# Named 00-* so it is read before other drop-ins (e.g. cloud-init's
# 50-cloud-init.conf): sshd uses the FIRST value it finds for each keyword.
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
